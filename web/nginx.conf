server {
  listen 80;
  root /usr/share/nginx/html;
  # X-Forwarded-For : valeur posée par Caddy (adresse réelle du client). Ne pas la remplacer par $remote_addr (= Caddy).
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $http_x_forwarded_for; client_max_body_size 5m; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; }
}
