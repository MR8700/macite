# Blueprint Render : API FastAPI + PostgreSQL/PostGIS + disque persistant des photos.
# Render lit ce fichier à la racine du dépôt et déploie les commits de main.
services:
  - type: web
    name: macite-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: 0.5c-512mb
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    disk:
      name: survey-photos
      mountPath: /app/photos
      sizeGB: 1
    envVars:
      - key: MACITE_ENV
        value: production
      - key: MACITE_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: macite-db
          property: connectionString
      - key: PHOTO_DIR
        value: /app/photos
      - key: MACITE_TRUST_PROXY
        value: "1"
      - key: MACITE_CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: MACITE_CORS_ORIGINS
        sync: false
      - key: MACITE_RELEVEUR_PASSWORD
        sync: false
      - key: MACITE_EXPERT_PASSWORD
        sync: false
      - key: MACITE_ADMIN_PASSWORD
        sync: false
      - key: MACITE_AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: MACITE_AI_LIVE
        value: "on"
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
      - key: MACITE_AI_DAILY_PER_USER
        value: "20"
      - key: MACITE_AI_DAILY_GLOBAL
        value: "400"
      - key: MACITE_AI_LIVE_DAILY_PER_USER
        value: "5"
      - key: MACITE_AI_LIVE_DAILY_GLOBAL
        value: "50"
      - key: MACITE_AI_LIVE_COOLDOWN_S
        value: "10"
      - key: MACITE_AI_LIVE_MAX_SESSION_S
        value: "300"
      - key: MACITE_SEARCH_PER_MIN
        value: "60"
      - key: MACITE_SITE
        value: kossodo
      - key: MACITE_LOGIN_MAX_FAILS_PER_IP
        value: "30"
      - key: MACITE_SYNC_ENV_PASSWORDS
        value: "0"

databases:
  - name: macite-db
    databaseName: macite
    user: macite
    region: frankfurt
    plan: 0.5c-1g
    postgresMajorVersion: "16"
    diskSizeGB: 15
    ipAllowList: []
